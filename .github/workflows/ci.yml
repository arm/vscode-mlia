name: CI

on:
  push:
    branches: ["main"]
    tags:
      - "v*.*.*"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - name: Checkout VS Code MLIA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline --no-audit --fund=false
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.32"
          enable-cache: false
      - name: Run tests
        run: npm test

  build:
    name: Build VSIX
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VS Code MLIA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline --no-audit --fund=false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.32"
          enable-cache: false
      - name: Check TypeScript
        run: npm run lint
      - name: Package extension
        run: npm run package
      - name: Upload VSIX
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: vsix-package
          path: "*.vsix"
          if-no-files-found: error
      - name: Create extension SBOM
        run: |
          mkdir -p sbom
          npm exec --yes --package=@cyclonedx/cyclonedx-npm@4.2.1 -- \
            cyclonedx-npm --omit dev --package-lock-only \
            --mc-type application --output-format JSON \
            --output-file sbom/vscode-mlia.cdx.json
          python scripts/add-sbom-disclaimer.py \
            sbom/vscode-mlia.cdx.json
      - name: Validate SBOM runtime dependencies
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          lock = json.loads(Path("package-lock.json").read_text())
          sbom = json.loads(Path("sbom/vscode-mlia.cdx.json").read_text())
          expected = {
              (package.get("name") or path.rsplit("node_modules/", 1)[-1], package["version"])
              for path, package in lock["packages"].items()
              if path and not package.get("dev") and not package.get("link")
          }
          actual = {
              ("/".join(filter(None, (component.get("group"), component["name"]))), component["version"])
              for component in sbom.get("components", [])
          }
          if actual != expected:
              raise SystemExit(
                  f"SBOM dependency mismatch. Missing: {sorted(expected - actual)}; "
                  f"unexpected: {sorted(actual - expected)}"
              )
          print(f"Verified {len(actual)} runtime dependencies in the SBOM")
          PY
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: project-sbom
          path: sbom/*.json
          if-no-files-found: error

  release-and-publish:
    name: Release and publish
    needs: [build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout VS Code MLIA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download VSIX
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vsix-package
          path: artifacts/vsix
      - name: Download SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: project-sbom
          path: artifacts/sbom
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          PRE_RELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          prerelease_args=()
          if [ "$PRE_RELEASE" = "true" ]; then
            prerelease_args+=(--prerelease)
          fi
          if gh release view "$REF_NAME" >/dev/null 2>&1; then
            gh release upload "$REF_NAME" artifacts/vsix/*.vsix artifacts/sbom/*.json \
              --clobber
          else
            gh release create "$REF_NAME" artifacts/vsix/*.vsix artifacts/sbom/*.json \
              --title "$REF_NAME" \
              --generate-notes \
              --verify-tag \
              "${prerelease_args[@]}"
          fi
      - name: Set up Node.js
        if: github.repository_owner == 'arm'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false

  sync-commits-to-public-repo:
    name: Sync commits to public repo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner != 'arm'
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VS Code MLIA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Checkout public VS Code MLIA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: arm/vscode-mlia
          token: ${{ secrets.ARM_ORG_TOKEN }}
          path: target-repo
          fetch-depth: 0
          persist-credentials: true
      - name: Push commits to public repo
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          cd target-repo
          git remote add source "$SOURCE_URL"
          git fetch source main
          git checkout main
          git merge source/main
          git push origin main

  sync-release-tags-to-public-repo:
    name: Sync release tags to public repo
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') && github.repository_owner != 'arm'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VS Code MLIA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Checkout public VS Code MLIA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: arm/vscode-mlia
          token: ${{ secrets.ARM_ORG_TOKEN }}
          path: target-repo
          persist-credentials: true
      - name: Push tag to public repo
        env:
          REF_NAME: ${{ github.ref_name }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          cd target-repo
          git remote add source "$SOURCE_URL"
          git fetch source --tags
          git push origin "refs/tags/$REF_NAME"
