name: Internal PR Checks

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review, labeled, unlabeled]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  checks:
    if: ${{ github.event.repository.private }}
    uses: Arm-Debug/ai-debug-workflows/.github/workflows/internal-checks.yml@d4b3e0e95cece1829f1b343bf797ee8f5f9299ed # main
    with:
      internal_scan: true
      internal_review: true
    secrets:
      BLACKDUCK_API_TOKEN: ${{ secrets.BLACKDUCK_API_TOKEN }}
