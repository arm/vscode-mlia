name: Lint and Format

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint-and-format:
    runs-on: ${{ vars.LINUX_RUNNER }}
    steps:
      - name: Checkout VS Code MLIA
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Qlty
        uses: qltysh/qlty-action/install@a2277a908db90c4c868832fb9204521fb940fdb4 # v1.2.0
      - name: Check lint
        run: qlty check
