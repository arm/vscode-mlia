name: Lint and Format

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint-and-format:
    runs-on: ${{ vars.LINUX_RUNNER }}
    steps:
      - name: Checkout MLIA for VS Code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Qlty
        uses: qltysh/qlty-action/install@08a0a862c159eae9b9003081da6663d96efef637 # v1.2.0
      - name: Check lint
        run: qlty check
